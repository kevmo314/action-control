# Experimental Action Control EIS trial; runtime-only, not installed by default.
[Service]
BindReadOnlyPaths=/run/action-control-eis-rotation/libosmo_eis_preview_rotation.so:/usr/lib/camera/components/com.dji.node.eis_preview.so
# Prevent repeated crash/restart cycles and large native core dumps in a trial.
Restart=no
LimitCORE=0
